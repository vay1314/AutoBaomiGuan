name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v1.0.0. Leave empty to auto-generate one."
        required: false
        type: string
      release_name:
        description: "Release title. Leave empty to auto-generate one."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build UI executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name AutoBaomiGuanUI `
            ui.py

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        run: |
          $tagName = "${{ inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tagName)) {
            $tagName = "win-ui-${{ github.run_number }}"
          }

          $releaseName = "${{ inputs.release_name }}"
          if ([string]::IsNullOrWhiteSpace($releaseName)) {
            $releaseName = "Windows UI Build ${{ github.run_number }}"
          }

          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoBaomiGuanUI-windows
          path: dist/AutoBaomiGuanUI.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload executable to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: dist/AutoBaomiGuanUI.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
